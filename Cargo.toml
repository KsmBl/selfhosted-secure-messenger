[workspace]
resolver = "3"
members = [
    "clients/linux",
    "crates/ssm-client",
    "crates/ssm-core",
    "crates/ssm-ffi",
    "crates/ssm-proto",
    "server",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

# Argon2 with production parameters is unusably slow unoptimized.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
