[package]
name = "ssm-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssm-core = { version = "0.1.0", path = "../ssm-core" }
ssm-proto = { version = "0.1.0", path = "../ssm-proto" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.9.1"

[dev-dependencies]
axum = "0.8.9"
postgresql_embedded = "0.22.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
ssm-server = { path = "../../server" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

# Android has no usable platform verifier without JNI setup: use Mozilla's
# root store there (ADR-0009).
[target.'cfg(target_os = "android")'.dependencies]
rustls = "0.23"
webpki-roots = "1"
