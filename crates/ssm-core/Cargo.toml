[package]
name = "ssm-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ssm-proto = { version = "0.1.0", path = "../ssm-proto" }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
vodozemac = { version = "0.11.1", default-features = false, features = ["precomputed-tables"] }
zeroize = { version = "1.9.1", features = ["derive"] }
